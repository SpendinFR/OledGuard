name: Build OledGuardNeuf

on:
  push:
    branches:
      - oledguard-neuf
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Publish
        run: dotnet publish OledGuardNeuf.csproj -c Release -r win-x64 --self-contained true -p:PublishSingleFile=true -p:DebugType=None -p:DebugSymbols=false -o publish

      - name: Upload executable
        uses: actions/upload-artifact@v4
        with:
          name: OledGuardNeuf-win-x64
          path: publish/**
          if-no-files-found: error
